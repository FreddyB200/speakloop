[project]
name = "speakloop"
version = "0.0.1"
description = "A local-first speaking coach that turns the mistakes you make while speaking into practice."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
]

[project.scripts]
speakloop = "speakloop.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakloop"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in end-to-end tests that need external tools (set SPEAKLOOP_RUN_INTEGRATION=1)",
]
